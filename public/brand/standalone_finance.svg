<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Obsidian-Garnet Studio Chassis -->
    <radialGradient id="isoBg" cx="52%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#2A1219"/>
      <stop offset="56%" stop-color="#0B0B14"/>
      <stop offset="100%" stop-color="#04050A"/>
    </radialGradient>

    <!-- Warm Vermilion Studio Backlight -->
    <radialGradient id="isoAura" cx="56%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#EE2500" stop-opacity="0.48"/>
      <stop offset="62%" stop-color="#EE2500" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EE2500" stop-opacity="0"/>
    </radialGradient>

    <!-- Precision Dual-Tone Squircle Rim -->
    <linearGradient id="isoRim" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B66A" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#EE2500" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F7D388" stop-opacity="0.42"/>
    </linearGradient>

    <!-- PRISM 1 (Left Base Tier · Steady Principal Foundation) -->
    <linearGradient id="p1Top" x1="34" y1="108" x2="82" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA08A"/>
      <stop offset="100%" stop-color="#EE3512"/>
    </linearGradient>
    <linearGradient id="p1Front" x1="34" y1="115" x2="66" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DB2304"/>
      <stop offset="100%" stop-color="#6E0A00"/>
    </linearGradient>
    <linearGradient id="p1Side" x1="66" y1="115" x2="82" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A0E00"/>
      <stop offset="100%" stop-color="#3B0400"/>
    </linearGradient>

    <!-- PRISM 2 (Mid Compound Tier · Shingled Overlap Over Prism 1) -->
    <linearGradient id="p2Top" x1="72" y1="82" x2="122" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFBAA8"/>
      <stop offset="100%" stop-color="#FF4724"/>
    </linearGradient>
    <linearGradient id="p2Front" x1="72" y1="90" x2="106" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F22B06"/>
      <stop offset="100%" stop-color="#870D00"/>
    </linearGradient>
    <linearGradient id="p2Side" x1="106" y1="90" x2="122" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9E1100"/>
      <stop offset="100%" stop-color="#450500"/>
    </linearGradient>

    <!-- PRISM 3 (Right Hero Summit · Towering 3D Vermilion Ingot #EE2500) -->
    <linearGradient id="p3Top" x1="112" y1="52" x2="166" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE2D9"/>
      <stop offset="50%" stop-color="#FF7A5C"/>
      <stop offset="100%" stop-color="#EE2500"/>
    </linearGradient>
    <linearGradient id="p3Front" x1="112" y1="62" x2="148" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5E40"/>
      <stop offset="44%" stop-color="#EE2500"/>
      <stop offset="100%" stop-color="#960F00"/>
    </linearGradient>
    <linearGradient id="p3Side" x1="148" y1="62" x2="166" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B81600"/>
      <stop offset="100%" stop-color="#4F0600"/>
    </linearGradient>

    <!-- Floating 3D Extruded Aerospace Titanium-Gold Rising Arrow (↗) -->
    <linearGradient id="isoGoldTop" x1="36" y1="126" x2="154" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B66A"/>
      <stop offset="48%" stop-color="#FFEBA8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="isoGoldSide" x1="36" y1="130" x2="154" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#87540C"/>
      <stop offset="55%" stop-color="#B87E22"/>
      <stop offset="100%" stop-color="#D49836"/>
    </linearGradient>

    <!-- Deep Inter-Layer Parallax Occlusion Shadow -->
    <filter id="prismShadow" x="-25%" y="-15%" width="150%" height="135%">
      <feDropShadow dx="-5" dy="6" stdDeviation="4.5" flood-color="#050103" flood-opacity="0.78"/>
    </filter>
    <!-- Floating 3D Ribbon Elevation Shadow -->
    <filter id="goldRibbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#1E0200" flood-opacity="0.86"/>
    </filter>
  </defs>

  <!-- Squircle Base Chassis -->
  <rect width="200" height="200" rx="46" fill="url(#isoBg)"/>
  <rect width="198" height="198" x="1" y="1" rx="45" stroke="url(#isoRim)" stroke-width="1.5"/>

  <!-- Calibration Ring & Aura -->
  <circle cx="100" cy="100" r="84" fill="url(#isoAura)"/>
  <circle cx="100" cy="100" r="84" stroke="#E5B66A" stroke-opacity="0.13" stroke-dasharray="3 6"/>
  <circle cx="100" cy="100" r="92" stroke="#FFFFFF" stroke-opacity="0.03"/>

  <!-- Astronomical Observatory Crosshair Reticle in Upper-Left Sky (观测准星 · 看清净值) -->
  <circle cx="55" cy="57" r="9.5" stroke="#E5B66A" stroke-width="1.4" stroke-opacity="0.46"/>
  <path d="M 55 43.5 V 49.5 M 55 64.5 V 70.5 M 41.5 57 H 47.5 M 62.5 57 H 68.5"
        stroke="#E5B66A" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/>
  <circle cx="55" cy="57" r="2.3" fill="#F7D388"/>

  <!-- ==================== 3D SHINGLED ISOMETRIC RUBY-CRYSTAL WEALTH PRISMS ==================== -->
  <!-- PRISM 1 (Left Base Tier: x=34..82) -->
  <g filter="url(#prismShadow)">
    <path d="M 34 115 L 66 122 V 157 L 34 150 Z" fill="url(#p1Front)"/>
    <path d="M 66 122 L 82 112 V 147 L 66 157 Z" fill="url(#p1Side)"/>
    <path d="M 34 115 L 50 105 L 82 112 L 66 122 Z" fill="url(#p1Top)"/>
    <path d="M 34 115 L 66 122 L 82 112" stroke="#FFB8A6" stroke-width="1.2" stroke-opacity="0.68" stroke-linejoin="round"/>
    <line x1="66" y1="122" x2="66" y2="157" stroke="#FF8B70" stroke-width="1.1" stroke-opacity="0.48"/>
  </g>

  <!-- PRISM 2 (Mid Compound Tier: x=72..122 · 10px Shingled Overlap Over Prism 1!) -->
  <g filter="url(#prismShadow)">
    <path d="M 72 91 L 106 98.5 V 161 L 72 153.5 Z" fill="url(#p2Front)"/>
    <path d="M 106 98.5 L 122 88 V 150.5 L 106 161 Z" fill="url(#p2Side)"/>
    <path d="M 72 91 L 88 80.5 L 122 88 L 106 98.5 Z" fill="url(#p2Top)"/>
    <path d="M 72 91 L 106 98.5 L 122 88" stroke="#FFD4C7" stroke-width="1.3" stroke-opacity="0.76" stroke-linejoin="round"/>
    <line x1="106" y1="98.5" x2="106" y2="161" stroke="#FFA691" stroke-width="1.1" stroke-opacity="0.54"/>
    <line x1="72" y1="91" x2="72" y2="153.5" stroke="#FF9B82" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <!-- PRISM 3 (Right Hero Summit Tier: x=112..166 · 10px Shingled Overlap Over Prism 2!) -->
  <g filter="url(#prismShadow)">
    <path d="M 112 63 L 148 71 V 165 L 112 157 Z" fill="url(#p3Front)"/>
    <path d="M 148 71 L 166 59.5 V 153.5 L 148 165 Z" fill="url(#p3Side)"/>
    <path d="M 112 63 L 130 51.5 L 166 59.5 L 148 71 Z" fill="url(#p3Top)"/>
    <path d="M 112 63 L 148 71 L 166 59.5" stroke="#FFF2EE" stroke-width="1.5" stroke-opacity="0.88" stroke-linejoin="round"/>
    <line x1="148" y1="71" x2="148" y2="165" stroke="#FFC7B8" stroke-width="1.2" stroke-opacity="0.64"/>
    <line x1="112" y1="63" x2="112" y2="157" stroke="#FFB29E" stroke-width="1.1" stroke-opacity="0.42"/>
  </g>

  <!-- ==================== FLOATING 3D EXTRUDED TITANIUM-GOLD COMPOUND ARROW (↗) ==================== -->
  <g filter="url(#goldRibbonShadow)">
    <!-- 3D Lower Extrusion Bevel -->
    <path d="M 38 122 C 72 116, 103 90, 147 38" stroke="url(#isoGoldSide)" stroke-width="10.2" stroke-linecap="round" transform="translate(0, 4)"/>
    <path d="M 126 38.5 L 149 36.5 L 147 59.5" stroke="url(#isoGoldSide)" stroke-width="9.8" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0, 4)"/>

    <!-- Gleaming Sunlit Top Gold Ribbon -->
    <path d="M 38 122 C 72 116, 103 90, 147 38" stroke="url(#isoGoldTop)" stroke-width="9.8" stroke-linecap="round"/>
    <path d="M 126 38.5 L 149 36.5 L 147 59.5" stroke="url(#isoGoldTop)" stroke-width="9.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="38" cy="122" r="5" fill="#FFFDF7"/>
  </g>
</svg>
