<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Obsidian Studio Background (Family Unified) -->
    <radialGradient id="finBgGrad" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="58%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>

    <!-- Master Titanium Gold Gradient (Family Unified) -->
    <linearGradient id="finGoldGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#FFF9EC"/>
      <stop offset="30%" stop-color="#F7D388"/>
      <stop offset="62%" stop-color="#E5B66A"/>
      <stop offset="100%" stop-color="#9E6D20"/>
    </linearGradient>

    <linearGradient id="finMutedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C28E3A"/>
      <stop offset="100%" stop-color="#5E3F12"/>
    </linearGradient>

    <!-- Wealth Management 3D Vermilion Prism Gradient (#EE2500 · userSpaceOnUse) -->
    <linearGradient id="finRedIso" x1="84" y1="62" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4726"/>
      <stop offset="50%" stop-color="#EE2500"/>
      <stop offset="100%" stop-color="#B81600"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Base Chassis -->
  <rect width="200" height="200" rx="46" fill="url(#finBgGrad)"/>
  <rect width="198" height="198" x="1" y="1" rx="45" stroke="#E5B66A" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Matrix Grid Proportions (1.8:1, 1.8:0.9) -->
  <circle cx="100" cy="100" r="82" stroke="#E5B66A" stroke-opacity="0.12" stroke-dasharray="3 6"/>
  <circle cx="100" cy="100" r="92" stroke="#FFFFFF" stroke-opacity="0.04"/>

  <!-- ==================== [TOP-LEFT] Main Core Block: 72x72 (1.8 x 1.8) ==================== -->
  <!-- Product 01: 理财观测站 (Solid Titanium Gold Die · 3D Stepped Ruby Prisms + Soaring Arrow ↗) -->
  <rect x="40" y="42" width="72" height="72" rx="10" fill="url(#finGoldGrad)"/>

  <!-- Observatory Crosshair Reticle (+) in Upper-Left -->
  <path d="M 55 54 V 60 M 52 57 H 58" stroke="#0b0f17" stroke-width="1.7" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- 3 Shingled 3D Isometric Ruby-Crystal Wealth Prisms (Front + Right Extrusion + Top Facets) -->
  <!-- Tier 1 (Left Base) -->
  <g>
    <path d="M 48 86 L 60 89 V 102 L 48 99 Z" fill="#EE2500" fill-opacity="0.66"/>
    <path d="M 60 89 L 66 85 V 98 L 60 102 Z" fill="#8F0E00" fill-opacity="0.82"/>
    <path d="M 48 86 L 54 82 L 66 85 L 60 89 Z" fill="#FF5E40" fill-opacity="0.55"/>
  </g>

  <!-- Tier 2 (Mid Compound · Overlapping Tier 1 with Crisp Gold Hairline Separation) -->
  <g>
    <path d="M 65.5 75.5 L 78.5 78.5 V 103 L 65.5 100 Z" fill="#EE2500" fill-opacity="0.84"/>
    <path d="M 78.5 78.5 L 85 74 V 98.5 L 78.5 103 Z" fill="#8F0E00" fill-opacity="0.92"/>
    <path d="M 65.5 75.5 L 72 71 L 85 74 L 78.5 78.5 Z" fill="#FF6647" fill-opacity="0.72"/>
    <line x1="65.5" y1="75.5" x2="65.5" y2="100" stroke="#F7D388" stroke-width="1.1"/>
  </g>

  <!-- Tier 3 (Right Hero Summit · Overlapping Tier 2) -->
  <g>
    <path d="M 84 63.5 L 98 67 V 104.5 L 84 101 Z" fill="url(#finRedIso)"/>
    <path d="M 98 67 L 104.5 62.5 V 100 L 98 104.5 Z" fill="#7D0C00"/>
    <path d="M 84 63.5 L 90.5 59 L 104.5 62.5 L 98 67 Z" fill="#FF7559"/>
    <line x1="84" y1="63.5" x2="84" y2="101" stroke="#F7D388" stroke-width="1.2"/>
  </g>

  <!-- Bold Soaring Compound Growth Arrow (↗) -->
  <path d="M 50 78 C 65 75, 79 65, 95 50" stroke="#0b0f17" stroke-width="3.6" stroke-linecap="round" stroke-opacity="0.86"/>
  <path d="M 86 50 L 95.5 49.5 L 95 59" stroke="#0b0f17" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.86"/>

  <!-- ==================== [TOP-RIGHT] Communication Bus: 40x72 (1.0 x 1.8) ==================== -->
  <rect x="120" y="42" width="40" height="72" rx="10" fill="url(#finMutedGrad)" opacity="0.85"/>
  <line x1="140" y1="58" x2="140" y2="98" stroke="#FFF9EC" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- ==================== [BOTTOM-LEFT] Memory Buffer: 72x36 (1.8 x 0.9) ==================== -->
  <rect x="40" y="122" width="72" height="36" rx="8" fill="url(#finMutedGrad)" opacity="0.85"/>
  <line x1="58" y1="140" x2="94" y2="140" stroke="#FFF9EC" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- ==================== [BOTTOM-RIGHT] AI Accelerator: 40x36 (1.0 x 0.9) ==================== -->
  <rect x="120" y="122" width="40" height="36" rx="8" fill="url(#finGoldGrad)"/>
  <!-- Status Indicator: Wealth Net Value Red Spark (#EE2500) -->
  <circle cx="140" cy="140" r="5.5" stroke="#EE2500" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="140" cy="140" r="3.2" fill="#EE2500"/>
  <circle cx="140" cy="140" r="1.2" fill="#FFFFFF"/>
</svg>
