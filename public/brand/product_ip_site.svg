<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Obsidian Studio Background (Aligned 1:1 with Master 09) -->
    <radialGradient id="ipBgGrad" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="58%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>

    <!-- Master Titanium Gold Gradient -->
    <linearGradient id="ipGoldGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#FFF9EC"/>
      <stop offset="30%" stop-color="#F7D388"/>
      <stop offset="62%" stop-color="#E5B66A"/>
      <stop offset="100%" stop-color="#9E6D20"/>
    </linearGradient>

    <!-- Secondary Structural Gold Gradient -->
    <linearGradient id="ipMutedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C28E3A"/>
      <stop offset="100%" stop-color="#5E3F12"/>
    </linearGradient>

    <!-- Subtle Singularity Core Glow -->
    <filter id="ipCoreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Base Chassis -->
  <rect width="200" height="200" rx="46" fill="url(#ipBgGrad)"/>
  <rect width="198" height="198" x="1" y="1" rx="45" stroke="#E5B66A" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Precision Calibration Track -->
  <circle cx="100" cy="100" r="82" stroke="#E5B66A" stroke-opacity="0.12" stroke-dasharray="3 6"/>
  <circle cx="100" cy="100" r="92" stroke="#FFFFFF" stroke-opacity="0.04"/>

  <!-- ==================== [TOP-LEFT] Main Core Block: 72x72 Square (1.8 x 1.8) ==================== -->
  <!-- Product 05: 公众号 IP 站点 (两态合一：严格复用纯粹 09 母标四核几何) -->
  <rect x="40" y="42" width="72" height="72" rx="10" fill="url(#ipGoldGrad)"/>

  <!-- ==================== [TOP-RIGHT] Communication Bus: 40x72 (1.0 x 1.8) ==================== -->
  <rect x="120" y="42" width="40" height="72" rx="10" fill="url(#ipMutedGrad)" opacity="0.85"/>
  <line x1="140" y1="58" x2="140" y2="98" stroke="#FFF9EC" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- ==================== [BOTTOM-LEFT] Memory Buffer: 72x36 (1.8 x 0.9) ==================== -->
  <rect x="40" y="122" width="72" height="36" rx="8" fill="url(#ipMutedGrad)" opacity="0.85"/>
  <line x1="58" y1="140" x2="94" y2="140" stroke="#FFF9EC" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- ==================== [BOTTOM-RIGHT] AI Accelerator: 40x36 (1.0 x 0.9) ==================== -->
  <rect x="120" y="122" width="40" height="36" rx="8" fill="url(#ipGoldGrad)"/>
  <!-- Singularity Spark Core + Outer Calibration Ring (1:1 Aligned with Master 09) -->
  <circle cx="140" cy="140" r="5.6" stroke="#FFF8E8" stroke-width="1.2" stroke-opacity="0.55"/>
  <circle cx="140" cy="140" r="3.4" fill="#FFFFFF" filter="url(#ipCoreGlow)"/>
</svg>
