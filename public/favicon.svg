<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Studio Background -->
    <radialGradient id="jtBg" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#161c28"/>
      <stop offset="55%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Master Aerospace Titanium Gold Gradient -->
    <linearGradient id="titaniumGold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="25%" stop-color="#F7D388"/>
      <stop offset="60%" stop-color="#E5B562"/>
      <stop offset="85%" stop-color="#B8822E"/>
      <stop offset="100%" stop-color="#7A5218"/>
    </linearGradient>

    <!-- Secondary Structural Gold -->
    <linearGradient id="structGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8822E"/>
      <stop offset="100%" stop-color="#5E3F12"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- ==================== BASE CONTAINER ==================== -->
  <!-- Premium Squircle Chassis -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="url(#jtBg)"/>

  <!-- Subtle Precision Rim (Hairline Bezel) -->
  <rect x="18" y="18" width="476" height="476" rx="114" stroke="url(#titaniumGold)" stroke-width="1.2" stroke-opacity="0.22"/>

  <!-- Concentric Spatial Calibration Rings -->
  <circle cx="256" cy="256" r="210" stroke="url(#titaniumGold)" stroke-width="0.8" stroke-dasharray="4 8" stroke-opacity="0.12"/>
  <circle cx="256" cy="256" r="226" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- ==================== 09 SILICON MATRIX SYSTEM ==================== -->
  <!-- Mathematical Proportions:
       Left Width: 180 | Right Width: 100 -> Ratio 180:100 = 1.8 : 1.0
       Top Height: 180 | Bottom Height: 90 -> Ratio 180:90 = 1.8 : 0.9 (2.0)
       Gap: 20px | Bounding Box: 300x290 (Centered on 512x512 at x:106, y:111)
  -->

  <g filter="url(#softShadow)">
    <!-- [TOP-LEFT] Main Core Block: 180x180 Pure Square (1.8 x 1.8) -->
    <rect x="106" y="111" width="180" height="180" rx="24" fill="url(#titaniumGold)"/>

    <!-- [TOP-RIGHT] Communication Bus / Side Wing: 100x180 (1.0 x 1.8) -->
    <rect x="306" y="111" width="100" height="180" rx="24" fill="url(#structGold)" opacity="0.85"/>
    <line x1="356" y1="151" x2="356" y2="251" stroke="#FFF8E8" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="6 6"/>

    <!-- [BOTTOM-LEFT] Memory / Base Buffer: 180x90 (1.8 x 0.9) -->
    <rect x="106" y="311" width="180" height="90" rx="20" fill="url(#structGold)" opacity="0.85"/>
    <line x1="151" y1="356" x2="241" y2="356" stroke="#FFF8E8" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="6 6"/>

    <!-- [BOTTOM-RIGHT] AI Neural Accelerator: 100x90 (1.0 x 0.9) -->
    <rect x="306" y="311" width="100" height="90" rx="20" fill="url(#titaniumGold)"/>
    <!-- Singularity Spark Core -->
    <circle cx="356" cy="356" r="8" fill="#FFFFFF" filter="url(#coreGlow)"/>
    <circle cx="356" cy="356" r="14" stroke="#FFF8E8" stroke-width="2" stroke-opacity="0.5"/>
  </g>
</svg>
